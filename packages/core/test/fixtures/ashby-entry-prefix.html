<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Forward Deployed Engineer @ Acme</title></head>
<body><div id="root">
<!--
  Trimmed from a live Ashby form (2026-10). Radio-group questions are named `<entryId>_<fieldPath>` where the entryId prefix
  is regenerated on every page render (data-field-entry-id), so a name scraped at extraction time never exists on a later load.
  The script below fills in a fresh prefix on each load, like the SPA.
-->
<div class="ashby-application-form-container">
  <div class="_fieldEntry ashby-application-form-field-entry" data-field-path="_systemfield_email"><label class="ashby-application-form-question-title" for="_systemfield_email">Email</label><input name="_systemfield_email" id="_systemfield_email" type="email"></div>
  <div data-field-path="9ea8b1bb-a272-4352-9e26-50b387d8c025" data-field-entry-id="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025"><fieldset class="_container_1258i_28 _fieldEntry_1e3gg_28 ashby-application-form-input-radio-group"><label class="_heading_f7cvd_52 _required_f7cvd_91 ashby-application-form-question-title" for="9ea8b1bb-a272-4352-9e26-50b387d8c025">How did you hear about Acme?&nbsp;</label>
    <div class="ashby-application-form-input-radio-group-option"><span data-disabled="false"><span class="_circle_132c8_77"></span><input type="radio" id="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-0" name="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025" class="ashby-application-form-input-radio-group-option-radio" style="opacity:0;position:absolute"></span><label for="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-0" class="ashby-application-form-input-radio-group-option-label">I'm a user</label></div>
    <div class="ashby-application-form-input-radio-group-option"><span data-disabled="false"><span class="_circle_132c8_77"></span><input type="radio" id="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-1" name="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025" class="ashby-application-form-input-radio-group-option-radio" style="opacity:0;position:absolute"></span><label for="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-1" class="ashby-application-form-input-radio-group-option-label">Job board </label></div>
    <div class="ashby-application-form-input-radio-group-option"><span data-disabled="false"><span class="_circle_132c8_77"></span><input type="radio" id="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-2" name="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025" class="ashby-application-form-input-radio-group-option-radio" style="opacity:0;position:absolute"></span><label for="__P___9ea8b1bb-a272-4352-9e26-50b387d8c025-labeled-radio-2" class="ashby-application-form-input-radio-group-option-label">Other (please specify)</label></div>
  </fieldset></div>
  <div class="_fieldEntry ashby-application-form-field-entry" data-field-path="f1d7e277-0c8f-4ff9-87d1-3d17914a8063"><label class="ashby-application-form-question-title" for="f1d7e277-0c8f-4ff9-87d1-3d17914a8063">If other, please specify below</label><input type="text" name="f1d7e277-0c8f-4ff9-87d1-3d17914a8063" id="f1d7e277-0c8f-4ff9-87d1-3d17914a8063"></div>
  <div class="_fieldEntry ashby-application-form-field-entry" data-field-path="c0ffee00-1111-4222-8333-944455556666"><fieldset class="ashby-application-form-input-checkbox-group"><label class="ashby-application-form-question-title" for="c0ffee00-1111-4222-8333-944455556666">Which languages do you use?</label>
    <div><input type="checkbox" id="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-0" name="__P___c0ffee00-1111-4222-8333-944455556666"><label for="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-0">TypeScript</label></div>
    <div><input type="checkbox" id="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-1" name="__P___c0ffee00-1111-4222-8333-944455556666"><label for="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-1">Python</label></div>
    <div><input type="checkbox" id="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-2" name="__P___c0ffee00-1111-4222-8333-944455556666"><label for="__P___c0ffee00-1111-4222-8333-944455556666-labeled-checkbox-2">Go</label></div>
  </fieldset></div>
</div>
<button type="button" class="ashby-application-form-submit-button"><span>Submit Application</span></button>
</div>
<script>
(() => {
  // fresh entry-id prefix per render, like the real SPA
  const p = crypto.randomUUID();
  document.querySelectorAll('[name*="__P__"], [id*="__P__"], [for*="__P__"], [data-field-entry-id*="__P__"]').forEach((el) => {
    for (const a of ['name', 'id', 'for', 'data-field-entry-id']) if (el.getAttribute(a)?.includes('__P__')) el.setAttribute(a, el.getAttribute(a).replace('__P__', p));
  });
  const send = (op) => fetch('/api/non-user-graphql?op=' + op, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ operationName: op, variables: {} }) });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') send('ApiSubmitSingleApplicationFormAction'); });
})();
</script>
</body></html>
