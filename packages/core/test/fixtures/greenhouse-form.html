<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - Job Application</title></head>
<body>
<form id="app" action="/apply" method="post">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required aria-required="true"></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required aria-required="true"></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="text" required aria-required="true"></div>
  <div><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required aria-required="true"></div>
  <div class="cb"><label for="country">Country *</label><input id="country" role="combobox" autocomplete="off" required aria-required="true" data-options="Mexico|Mexico City|United States|Guatemala"></div>
  <div class="cb"><label for="candidate-location">Location (City) *</label><input id="candidate-location" role="combobox" autocomplete="off" required aria-required="true" data-options="Mazatlán, Sinaloa, Mexico|Mazatlán, Mexico|Mazatenango, Guatemala"></div>
  <!-- Like Greenhouse: a required role=group labelled "Resume/CV"; after a successful upload the buttons and input are replaced by a filename chip. -->
  <div class="field-wrapper"><div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload"><div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div><div class="file-upload__wrapper"><div class="button-container"><button type="button" onclick="document.getElementById('resume').click()">Attach</button><button type="button" onclick="this.replaceWith(Object.assign(document.createElement('textarea'), { id: 'resume_text', name: 'resume_text' }))">Enter manually</button><input id="resume" name="resume" type="file" style="display:none"></div></div></div></div>
  <!-- Like Greenhouse: the cover letter textarea only exists after "Enter manually" is clicked. -->
  <div class="file-upload"><label>Cover Letter</label><button type="button" onclick="document.getElementById('cover_letter').click()">Attach</button><button type="button" onclick="this.replaceWith(Object.assign(document.createElement('textarea'), { id: 'cover_letter_text', name: 'cover_letter_text' }))">Enter manually</button><input id="cover_letter" name="cover_letter" type="file" style="display:none"></div>
  <div><label for="question_1">LinkedIn Profile *</label><input id="question_1" name="question_1" type="text" required aria-required="true"></div>
  <div class="cb"><label for="question_2">Are you authorized to work? *</label><input id="question_2" role="combobox" autocomplete="off" required aria-required="true" data-options="Yes|No"></div>
  <div><label for="question_3">Why us? *</label><textarea id="question_3" name="question_3" required aria-required="true"></textarea></div>
  <div class="cb"><label for="gender">Gender</label><input id="gender" role="combobox" autocomplete="off" data-options="Male|Female|Decline To Self Identify"></div>
  <div><label for="question_4">Native pick</label><select id="question_4" name="question_4"><option value=""></option><option>Yes</option><option>Maybe</option></select></div>
  <div id="question_5" data-chosen=""><button type="button" onclick="this.parentElement.dataset.chosen=this.textContent">Yes</button><button type="button" onclick="this.parentElement.dataset.chosen=this.textContent">No</button></div>
  <div class="cb"><label for="question_6">Pick several</label><input id="question_6" role="combobox" autocomplete="off" data-multi="1" data-options="A|B|C"></div>
  <div id="question_7"><button type="button" onclick="document.getElementById('app').submit()">Go</button></div>
  <button type="submit">Submit application</button>
</form>
<script>
(() => {
  const q = location.search;
  if (q.includes('norequired')) document.querySelectorAll('[required], [aria-required]').forEach((el) => { el.removeAttribute('required'); el.removeAttribute('aria-required'); });
  if (q.includes('errorboundary')) document.body.insertAdjacentHTML('afterbegin', '<div class="error-boundary">Something went wrong loading a widget</div>');
  // Like Greenhouse: after choosing a file the buttons + input are replaced by a filename chip (or an error shows in the group).
  // ?uploaderlate: the uploader is only ready 1 s after load; a file chosen earlier shows Greenhouse's
  //   "Cannot read properties of undefined (reading 'uploadFile')" in the group, keeps the input, and the uploader stays broken until a reload.
  // ?uploadfailtext: every upload shows an error text in the group and never a chip.
  if (q.includes('uploaderlate')) setTimeout(() => { window.__uploaderReady = true; }, 1000);
  const rl = document.getElementById('resume');
  const group = rl.closest('[role=group]');
  const showError = (text) => {
    group.querySelector('.file-upload__error')?.remove();
    group.querySelector('.file-upload__wrapper').insertAdjacentHTML('beforeend', '<p class="file-upload__error" style="color:red"></p>');
    group.querySelector('.file-upload__error').textContent = text;
  };
  rl.addEventListener('change', () => {
    if (!rl.files.length) return;
    if (q.includes('uploaderlate') && (!window.__uploaderReady || window.__uploaderBroken)) {
      window.__uploaderBroken = true;
      return showError("Cannot read properties of undefined (reading 'uploadFile')");
    }
    if (q.includes('uploadfailtext')) return showError('There was an error uploading your file. Please try again.');
    if (q.includes('uploadfail')) return showError('Upload failed');
    group.querySelector('.file-upload__wrapper').innerHTML = '<div class="file-upload__filename"><p class="chip"></p><button type="button" aria-label="Remove file">x</button></div>';
    group.querySelector('.chip').textContent = rl.files[0].name;
    // Like Greenhouse's resume parser clobbering the name: ?clearname clears once 700 ms after the chip appears.
    if (q.includes('clearname') && !q.includes('clearname=always')) setTimeout(() => { document.getElementById('first_name').value = ''; }, 700);
  });
  // ?cleartextarea: wipe the Why-us textarea once, 100 ms after it is first typed into.
  if (q.includes('cleartextarea')) document.getElementById('question_3').addEventListener('input', () => {
    if (window.__tw) return;
    window.__tw = true;
    setTimeout(() => { document.getElementById('question_3').value = ''; }, 100);
  });
  // ?clearname=always: every input into First Name starts (or extends) a 3 s window in which it is wiped every 100 ms, so a re-type is wiped again.
  if (q.includes('clearname=always')) {
    let until = 0, timer = null;
    document.getElementById('first_name').addEventListener('input', () => {
      until = Date.now() + 3000;
      if (timer) return;
      timer = setInterval(() => {
        document.getElementById('first_name').value = '';
        if (Date.now() > until) { clearInterval(timer); timer = null; }
      }, 100);
    });
  }
  const close = () => document.querySelectorAll('[role=listbox]').forEach((l) => l.remove());
  const render = (input) => {
    close();
    const opts = (input.dataset.options || '').split('|').filter((o) => o.toLowerCase().includes(input.value.toLowerCase()));
    const box = document.createElement('div');
    box.setAttribute('role', 'listbox');
    for (const o of opts) {
      const el = document.createElement('div');
      el.setAttribute('role', 'option');
      el.textContent = o;
      el.addEventListener('mousedown', (ev) => {
        ev.preventDefault();
        if (input.dataset.multi) {
          const chip = document.createElement('span');
          chip.className = 'select__multi-value__label';
          chip.textContent = o;
          input.parentElement.appendChild(chip);
          input.value = '';
        } else input.value = o;
        close();
      });
      box.appendChild(el);
    }
    if (input.getAttribute('aria-controls')) box.id = input.getAttribute('aria-controls');
    input.parentElement.appendChild(box);
  };
  document.querySelectorAll('input[role=combobox]').forEach((input) => {
    input.addEventListener('click', () => render(input));
    input.addEventListener('input', () => render(input));
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });
  });
  const form = document.getElementById('app');
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    await fetch('/apply', { method: 'POST', body: new FormData(form) });
    if (q.includes('errorboundary')) form.replaceWith(Object.assign(document.createElement('h1'), { textContent: 'Thank you for applying' }));
    else document.body.innerHTML = '<h1>Thank you for applying</h1>';
    history.pushState({}, '', '/acme/jobs/1/confirmation');
  });
})();
</script>
</body></html>
