<!doctype html>
<html><head><meta charset="utf-8"><title>Acme - Job Application</title></head>
<body>
<form id="app" action="/apply" method="post">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" type="text" required aria-required="true"></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" type="text" required aria-required="true"></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="text" required aria-required="true"></div>
  <div><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required aria-required="true"></div>
  <div class="cb"><label for="country">Country *</label><input id="country" role="combobox" autocomplete="off" required aria-required="true" data-options="Mexico|Mexico City|United States|Guatemala"></div>
  <div class="cb"><label for="candidate-location">Location (City) *</label><input id="candidate-location" role="combobox" autocomplete="off" required aria-required="true" data-options="Mazatlán, Sinaloa, Mexico|Mazatlán, Mexico|Mazatenango, Guatemala"></div>
  <div><label>Resume/CV</label><button type="button" onclick="document.getElementById('resume').click()">Attach</button><input id="resume" name="resume" type="file" style="display:none"></div>
  <div><label>Cover Letter</label><button type="button" onclick="document.getElementById('cover_letter').click()">Attach</button><input id="cover_letter" name="cover_letter" type="file" style="display:none"></div>
  <div><label for="question_1">LinkedIn Profile *</label><input id="question_1" name="question_1" type="text" required aria-required="true"></div>
  <div class="cb"><label for="question_2">Are you authorized to work? *</label><input id="question_2" role="combobox" autocomplete="off" required aria-required="true" data-options="Yes|No"></div>
  <div><label for="question_3">Why us? *</label><textarea id="question_3" name="question_3" required aria-required="true"></textarea></div>
  <div class="cb"><label for="gender">Gender</label><input id="gender" role="combobox" autocomplete="off" data-options="Male|Female|Decline To Self Identify"></div>
  <button type="submit">Submit application</button>
</form>
<script>
(() => {
  const close = () => document.querySelectorAll('[role=listbox]').forEach((l) => l.remove());
  const render = (input) => {
    close();
    const opts = (input.dataset.options || '').split('|').filter((o) => o.toLowerCase().includes(input.value.toLowerCase()));
    const box = document.createElement('div');
    box.setAttribute('role', 'listbox');
    for (const o of opts) {
      const el = document.createElement('div');
      el.setAttribute('role', 'option');
      el.textContent = o;
      el.addEventListener('mousedown', (ev) => { ev.preventDefault(); input.value = o; close(); });
      box.appendChild(el);
    }
    input.parentElement.appendChild(box);
  };
  document.querySelectorAll('input[role=combobox]').forEach((input) => {
    input.addEventListener('click', () => render(input));
    input.addEventListener('input', () => render(input));
    input.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });
  });
  const form = document.getElementById('app');
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    await fetch('/apply', { method: 'POST', body: new FormData(form) });
    document.body.innerHTML = '<h1>Thank you for applying</h1>';
    history.pushState({}, '', '/acme/jobs/1/confirmation');
  });
})();
</script>
</body></html>
